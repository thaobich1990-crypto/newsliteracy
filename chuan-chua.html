<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chuẩn chưa để đi đồn</title>
<meta name="google" content="notranslate">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif:wght@400;700&family=Dancing+Script:wght@600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: một cột như ứng dụng mạng xã hội; đồng hồ đêm-ngày trên đầu; mỗi đợt lướt kết thúc bằng một thẻ "Dừng lại một chút" */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#16181D; --muted:#626977; --line:#E0E3E8; --soft:#EEF0F3;
  --accent:#0E7469; --accent-ink:#FFFFFF; --hl:#FFE066; --hl-ink:#16181D;
  --red:#D92D3A; --ok:#1F8A4C; --okbg:#E3F4EA; --badbg:#FCE6E8; --warnbg:#FFF4D6;
  --paper:#FFFDF7; --paper-ink:#1E1E1E; --stamp:#C8102E;
  --f-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-serif:"Noto Serif", Georgia, "Times New Roman", serif;
  --f-hand:"Dancing Script", "Segoe Script", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#181B21; --ink:#ECEEF2; --muted:#9BA1AC; --line:#2A2F38; --soft:#20242C;
  --accent:#3CC4B4; --accent-ink:#0F1115; --hl:#F2C230; --hl-ink:#111;
  --red:#FF6B76; --ok:#5BD49A; --okbg:#133222; --badbg:#3A1820; --warnbg:#3A3115; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#181B21; --ink:#ECEEF2; --muted:#9BA1AC; --line:#2A2F38; --soft:#20242C;
  --accent:#3CC4B4; --accent-ink:#0F1115; --hl:#F2C230; --hl-ink:#111;
  --red:#FF6B76; --ok:#5BD49A; --okbg:#133222; --badbg:#3A1820; --warnbg:#3A3115; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:0 60px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:90px;resize:vertical}
label.lbl{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
.mark{background:linear-gradient(transparent 55%, var(--hl) 55%);padding:0 2px}

/* ---------- mở đầu ---------- */
.intro{padding-top:28px}
.intro h1{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.02em}
.intro h1 span{background:var(--hl);color:var(--hl-ink);padding:0 6px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.phone-tease{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.notif{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px}
.notif .ic{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.notif b{display:block;font-size:14px}
.notif span{font-size:14px;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:10px;font-size:15px}
.rules div{display:grid;grid-template-columns:28px 1fr;gap:8px}
.rules i{font-style:normal;font-family:var(--f-mono);font-weight:700;color:var(--accent)}

/* ---------- thanh trên ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.clock{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.clock b{font-family:var(--f-mono);font-size:20px}
.clock span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tbtn svg{width:16px;height:16px}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---------- đợt ---------- */
.wave-head{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.wave-head .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.75}
.wave-head h2{font-size:22px}
.wave-head p{font-size:15px;opacity:.92}
.wave-nav{display:flex;justify-content:space-between;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px 0}

/* ---------- bài đăng ---------- */
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.post.gone{opacity:.7}
.ph{display:flex;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.pn{min-width:0;flex:1}
.pn b{font-size:15px}
.pm{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1D9BF0;color:#fff;font-size:10px;margin-left:5px;vertical-align:1px}
.spon{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none}
.pb{font-size:15.5px;white-space:pre-line;overflow-wrap:anywhere}
.pb.loud{font-weight:600}
.pb.official{font-family:var(--f-serif);font-size:15px;white-space:pre-line}
.pa{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;gap:4px}
.act{background:none;border:0;display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--muted);padding:8px 6px;border-radius:8px;min-width:0}
.act svg{width:19px;height:19px;flex:none}
.act.on.like{color:var(--red)}
.act.on.like svg path{fill:currentColor}
.act.on.share{color:var(--accent)}
.act.check{color:var(--accent);font-weight:700}
.cms{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.cm{display:grid;grid-template-columns:30px 1fr;gap:8px}
.cm .ava{width:30px;height:30px;font-size:11px}
.cm .bub{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.cm .bub b{font-size:13px;display:block}
.cm .lk{font-size:12px;color:var(--muted);margin-top:3px}
.cm.rep{margin-left:38px}
.linkcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);padding:0}
.linkcard .lc-top{background:#B3121D;color:#FFE34D;font-weight:800;font-size:12px;padding:6px 10px;letter-spacing:.04em}
.linkcard .lc-top.ts{background:#0B3A5B;color:#fff;font-family:var(--f-serif)}
.linkcard .lc-b{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.linkcard .lc-t{font-weight:800;font-size:15px}
.linkcard .lc-d{font-size:13px;color:var(--muted)}

/* ---------- ảnh, video ---------- */
.media{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
.media svg{display:block;width:100%;height:auto}
.media.portrait{max-width:250px;margin:0 auto}
.findorig svg{width:13px!important;height:13px!important;display:inline-block!important;vertical-align:-2px}
.findorig{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:999px;font-size:12.5px;font-weight:600;padding:6px 10px;z-index:2}
.vsub{position:absolute;left:8px;right:8px;bottom:22px;text-align:center;color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 3px #000,0 0 6px #000;min-height:1.4em;pointer-events:none}
.vplay{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:24px;display:grid;place-items:center;z-index:2;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.vbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.25)}
.vbar span{display:block;height:100%;width:0;background:#fff}
.vlen{position:absolute;left:8px;bottom:10px;font-family:var(--f-mono);font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:4px;z-index:1}
.media.playing .vplay,.media.playing .vlen{display:none}
.media.playing .vbar span{animation:prog var(--dur) linear forwards}
@keyframes prog{to{width:100%}}
.helper,.carry{opacity:0}
.media.playing .sit{animation:sitk var(--dur) linear forwards}
.media.playing .helper{animation:helpk var(--dur) linear forwards}
.media.playing .carry{animation:carryk var(--dur) linear forwards}
@keyframes sitk{0%,52%{opacity:1}54%,100%{opacity:0}}
@keyframes helpk{0%,36%{opacity:0}40%,52%{opacity:1}54%,100%{opacity:0}}
@keyframes carryk{0%,52%{opacity:0;transform:translate(0,0)}54%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(88px,64px)}}
.media.playing .flick{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{opacity:.25}}
.media.playing .push1,.media.playing .push2{animation:sway .5s ease-in-out infinite alternate}
.push1,.push2{transform-box:fill-box;transform-origin:50% 100%}
.push2{animation-delay:.25s!important}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.mouth{transform-box:fill-box;transform-origin:center}
.media.playing .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(3)}}
.media.playing .rec{animation:flick 1s steps(2) infinite}

/* ---------- giấy tờ chụp lại ---------- */
.photo{background:#5b5146;padding:14px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f-serif);font-size:13px;line-height:1.6;padding:16px 16px 18px;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative}
.photo .paper{transform:rotate(-1.2deg)}
.paper .hdr{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;font-size:11px;font-weight:700}
.paper .hdr span{font-weight:400;font-style:italic}
.paper .ttl{text-align:center;font-weight:700;font-size:16px;margin:12px 0 2px}
.paper .sub{text-align:center;font-style:italic;font-size:12.5px;margin-bottom:8px}
.paper .fld{display:flex;gap:6px;align-items:flex-end;border-bottom:1px dotted #777;min-height:30px;position:relative}
.paper .fld .l{white-space:nowrap}
.paper .hw{font-family:var(--f-hand);font-size:19px;color:#1a2f7a;position:relative}
.paper .hw.off{top:-8px;transform:rotate(-2.5deg)}
.paper .hw.alt{font-family:"Times New Roman",serif;font-style:italic;font-size:15px;color:#24366e;top:-5px;letter-spacing:.02em}
.paper .ms{position:absolute;top:6px;left:8px;font-size:9.5px;color:#555;font-family:var(--f-ui)}
.paper .sig{display:flex;justify-content:flex-end;margin-top:10px}
.paper .sig div{text-align:center;position:relative;min-width:150px}
.paper .stamp{position:absolute;width:96px;height:96px;opacity:.85;mix-blend-mode:multiply}
.paper p{margin:0 0 6px}
.paper ol{margin:0 0 6px;padding-left:20px}

/* chụp màn hình nhóm chat */
.shot{background:#E9EDF2;color:#16181D;font-family:var(--f-ui);padding:0 0 10px}
.shot .sb{display:flex;justify-content:space-between;font-size:11px;font-weight:700;padding:6px 12px;background:#E9EDF2}
.shot .gh{background:#0068FF;color:#fff;padding:8px 12px;font-size:14px;font-weight:700}
.shot .gh span{display:block;font-weight:400;font-size:11.5px;opacity:.9}
.shot .msg{margin:12px 12px 0;display:flex;flex-direction:column;gap:3px;max-width:85%}
.shot .msg .n{font-size:11px;color:#596273}
.shot .msg .b{background:#fff;border-radius:10px;padding:7px 10px;font-size:13.5px}
.shot .msg .t{display:block;text-align:right;font-size:10.5px;color:#7a8291;margin-top:3px;font-family:var(--f-mono)}
.shot .vthumb{background:#0a0f1e;color:#fff;border-radius:8px;padding:18px 10px;font-size:12px;text-align:center}
.blurbox{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px}
.blurbox div{aspect-ratio:1;background:repeating-linear-gradient(45deg,#8a8f99 0 6px,#a4a9b3 6px 12px);filter:blur(2px);display:grid;place-items:center;color:#fff;font-size:11px;text-align:center;font-weight:700}
.adbanner{background:linear-gradient(135deg,#0f2a44,#1e4f7a);color:#fff;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.adbanner b{font-size:20px;font-weight:800;letter-spacing:.01em}
.adbanner .pct{align-self:flex-start;background:#FFD43B;color:#111;font-weight:800;border-radius:6px;padding:2px 8px}

/* ---------- bài báo ---------- */
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.art.tab{background:#fff;color:#111;border-color:#ddd}
.art.tab .foot{color:#555;border-color:#ddd}
.art.tab .mast{background:#B3121D;color:#FFE34D;font-weight:800;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.art.tab .mast span{background:#FFE34D;color:#B3121D;font-size:11px;padding:2px 6px;border-radius:4px}
.art.tab .in{padding:14px;display:flex;flex-direction:column;gap:10px}
.art.tab h3{font-size:21px;font-weight:800;color:#C1121F;text-transform:uppercase;line-height:1.25}
.art.tab .sapo{font-weight:700}
.art.tab .ad{border:2px dashed #C1121F;background:#FFF3B0;color:#7a0d14;font-weight:800;font-size:13px;padding:8px;text-align:center}
.art.news .mast{border-bottom:3px double var(--ink);padding:12px 14px 8px;text-align:center}
.art.news .mast b{font-family:var(--f-serif);font-size:22px;letter-spacing:.02em}
.art.news .mast div{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.art.news .in{padding:14px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-serif);font-size:15.5px;line-height:1.7}
.art.news .sec{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.art.news h3{font-family:var(--f-serif);font-size:22px}
.art.news .by{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.art.news .sapo{font-weight:700}
.art.news blockquote{margin:0;border-left:3px solid var(--line);padding-left:12px}
.art.news figcaption{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:4px}
.art .foot{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding:10px 14px}

/* ---------- thẻ thử thách ---------- */
.ch{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.ch .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.ch h3{font-size:20px}
.jd{display:flex;flex-direction:column;gap:12px}
.jitem{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.jitem .src{font-size:12.5px;color:var(--muted)}
.jitem .q{font-size:15px}
.jbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.jbtns button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 4px;font-size:14px;font-weight:700}
.jbtns button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jbtns button:disabled{cursor:default}
.jfb{font-size:14px;border-radius:8px;padding:8px 10px}
.jfb.good{background:var(--okbg)} .jfb.mid{background:var(--warnbg)} .jfb.bad{background:var(--badbg)}
.q{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.q .qp{font-weight:700}
.res{font-size:13px;font-weight:700;font-family:var(--f-mono)}
.res.ok{color:var(--ok)} .res.bad{color:var(--red)}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:11px 12px;cursor:pointer;border:1.5px solid transparent}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none;width:18px;height:18px}
.opt:has(input:checked){border-color:var(--accent)}
.cls{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cls .cs{font-size:12.5px;color:var(--muted)}
.mrow{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mrow .ml{font-weight:700;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.paperq{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.8}
.seg{display:inline;background:none;border:0;padding:1px 2px;text-align:left;border-bottom:1px dotted var(--muted);font-size:15px;line-height:1.8}
.seg.big{font-weight:800}
.seg.ad{font-family:var(--f-mono);font-size:13px}
.seg[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-bottom-color:transparent;border-radius:3px}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{font-size:14.5px;background:var(--soft);border-left:3px solid var(--hl);padding:9px 12px;border-radius:0 10px 10px 0}
.done{border:2px solid var(--ok);background:var(--okbg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.done .stamp-t{font-family:var(--f-mono);font-weight:700;color:var(--ok);letter-spacing:.06em}
.frag{background:var(--card);border:1.5px dashed var(--ink);border-radius:10px;padding:10px 12px;font-size:14.5px}
.frag b{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* ---------- tấm trượt ---------- */
.sheet>*,.art .in>*,.post>*{flex-shrink:0}
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;

const KEY='chuanchua.v4';
const fresh=()=>({team:'',start:0,end:0,stage:0,look:0,view:'intro',unlock:{0:1},done:{},hints:{},fails:{},draft:{},judge:{},likes:{},shares:{},shareEver:{},seen:[],sent:null,saved:[]});
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let inflight=false;
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9.@ ]/g,' ').replace(/\s+/g,' ').trim();
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const BASE=w=>STAGES[w].part?60:100;
const MAXK=STAGES.reduce((a,_,i)=>a+BASE(i),0);
const knowledge=()=>Object.values(S.done).reduce((a,b)=>a+b,0);
const BADTRUTH=['sai','gia'];
const TRUTH_LABEL={sai:'tin sai lệch',gia:'tin xuyên tạc',acy:'tin ác ý',dung:'thông tin đúng',trung:'trung tính'};
const isFalse=id=>BADTRUTH.includes(POSTS[id].truth), isHarm=id=>POSTS[id].truth==='acy'||id==='congly';
function judgeStats(){let n=0,pts=0;STAGES.forEach((w,wi)=>w.judge.forEach((j,ji)=>{n++;const a=S.judge[`${wi}_${ji}`];if(!a)return;if(j.best.includes(a))pts+=1;else if(j.ok.includes(a))pts+=.5}));return {n,pts,pct:n?Math.round(pts/n*100):0}}
function footprint(){
  const ever=Object.keys(S.shareEver).filter(k=>S.shareEver[k]);
  const sf=ever.filter(isFalse).length, sh=ever.filter(isHarm).length;
  const undone=ever.filter(k=>(isFalse(k)||isHarm(k))&&!S.shares[k]).length;
  const lf=Object.keys(S.likes).filter(k=>S.likes[k]&&(isFalse(k)||isHarm(k))).length;
  const sg=ever.filter(k=>POSTS[k].truth==='dung').length;
  return {sf,sh,undone,lf,sg,pen:10*sf+15*sh-3*undone+3*lf};
}
function totalScore(){return Math.max(0,knowledge()+judgeStats().pct-footprint().pen)}

const EMO=['soc','kinh hoang','phan no','gay bao','chan dong','rung dong','bang hoang','nong','khiep','dong long','tot do','sung sot','choang'];
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
function shouting(s){const L=(s||'').replace(/[^A-Za-zÀ-ỹ]/g,'');if(L.length<6)return false;const up=L.split('').filter(c=>c===c.toUpperCase()&&c!==c.toLowerCase()).length;return up/L.length>0.6}
function hasEmo(s){const n=' '+norm(s)+' ';return EMO.some(e=>n.includes(' '+e+' '))}
function headlineChecks(t){return [
  [words(t)>=6&&words(t)<=20,'Dài 6–20 chữ'],
  [!shouting(t)&&!/!/.test(t),'Không viết hoa cả câu, không dấu chấm than'],
  [!hasEmo(t),'Không dùng chữ cảm xúc (sốc, kinh hoàng, phẫn nộ…)'],
  [!/\?/.test(t),'Không đặt câu hỏi bỏ lửng'],
  [/(sinh vien|ky tuc xa|ktx|hoa lam)/.test(norm(t)),'Nêu rõ ai, ở đâu (sinh viên, ký túc xá, Hòa Lâm…)'],
  [!/(le minh an|trinh gia huy)/.test(norm(t)),'Không nêu họ tên đầy đủ của sinh viên']]}
function composeChecks(t,b){const nb=norm(b);return [...headlineChecks(t),
  [words(b)>=40&&words(b)<=60,`Đoạn tin dài 40–60 chữ (hiện có ${words(b)})`],
  [!shouting(b)&&!hasEmo(b),'Đoạn tin không viết hoa cả câu, không dùng chữ cảm xúc'],
  [/danh hoi dong/.test(nb)&&/(khong dung|sai|khong co|khong chinh xac|gia mao|bac bo|khong phai)/.test(nb),'Nói rõ thông tin “đánh hội đồng” là không đúng'],
  [/(theo |benh vien|nha truong|cho biet|xac nhan|thong bao)/.test(nb),'Có ghi nguồn (bệnh viện, nhà trường…)'],
  [!/(le minh an|trinh gia huy)/.test(nb),'Không nêu họ tên đầy đủ của sinh viên'],
  [!/(ngo thanh tuan|thanh tuan)/.test(nb+' '+norm(t)),'Không nêu tên người đứng sau khi chưa có kết luận']]}
function cklHTML(list,empty){return `<ul class="ckl">${list.map(([ok,l])=>[empty?false:ok,l]).map(([ok,l])=>`<li class="${ok?'ok':'no'}">${ok?'✓':'○'} ${l}</li>`).join('')}</ul>`}

  if(q.type==='sort') inner=q.items.map((it,ii)=>{const p=POSTS[it.post],v=d&&d.c?d.c[ii]:null,why=d&&d.w?d.w[ii]:'';

  if(q.type==='checks') inner=q.items.map((it,ii)=>`<label class="opt"><input type="checkbox" data-k="${id}" data-i="${ii}" ${d&&d[ii]?'checked':''}><span>${it.t}<br><small class="muted">Nguồn: ${it.src}</small></span></label>`).join('')+`<div id="fb_${id}" class="stack"></div>`;
  if(q.type==='headline') inner=`<input type="text" id="${id}" placeholder="Gõ tít mới của báo mình (6–20 chữ)" value="${esc(d||'')}"><div id="ck_${id}">${cklHTML(headlineChecks(d||''),!(d||'').trim())}</div>`;

function readQ(q,qi,key){const id=`q${key}_${qi}`,g=x=>document.getElementById(x);
  if(q.type==='choice'){const c=app.querySelector(`input[name="${id}"]:checked`);return c?+c.value:null}
  if(q.type==='text'||q.type==='headline') return g(id).value;
  if(q.type==='classify'||q.type==='selects') return (q.items||q.rows).map((_,ii)=>{const v=g(`${id}_${ii}`).value;return v===''?null:+v});
  if(q.type==='order') return q.items.map((_,ii)=>{const v=g(`${id}_${ii}`).value;return v===''?null:+v});
  if(q.type==='matrix') return q.rows.map((r,ri)=>q.cols.map((c,ci)=>app.querySelector(`[data-m="${id}"][data-r="${ri}"][data-c="${ci}"]`).getAttribute('aria-pressed')==='true'?1:0));
  if(q.type==='highlight') return q.segs.map((s,si)=>app.querySelector(`[data-h="${id}"][data-s="${si}"]`).getAttribute('aria-pressed')==='true'?1:0);
  if(q.type==='picks') return q.items.map((_,ii)=>app.querySelector(`[data-p="${id}"][data-i="${ii}"]`).getAttribute('aria-pressed')==='true'?1:0);
  if(q.type==='sort'){const c=q.items.map((_,ii)=>{const b=app.querySelector(`[data-sort="${id}"][data-i="${ii}"][aria-pressed="true"]`);return b?+b.dataset.o:null});
    const w=q.items.map((it,ii)=>it.hard?g(`${id}_w${ii}`).value:'');return {c,w,some:x=>c.some(x)}}
  if(q.type==='compose') return {t:g(`${id}_t`).value,b:g(`${id}_b`).value};
  if(q.type==='checks') return q.items.map((_,ii)=>app.querySelector(`[data-k="${id}"][data-i="${ii}"]`).checked?1:0);
}
function checkQ(q,v){
  if(q.type==='choice') return {ok:v===q.ans};
  if(q.type==='text'){const n=norm(v);return {ok:q.accept.some(a=>n.includes(a))}}
  if(q.type==='classify'){const k=q.items.filter((it,i)=>v[i]===it.ans).length;return {ok:k===q.items.length,msg:`${k}/${q.items.length} đúng`}}
  if(q.type==='selects'){const k=q.rows.filter((r,i)=>r.ans.includes(v[i])).length;return {ok:k===q.rows.length,msg:`${k}/${q.rows.length} đúng`}}
  if(q.type==='order'){const k=q.items.filter((it,i)=>v[i]===it.pos).length;return {ok:k===q.items.length,msg:`${k}/${q.items.length} mốc đúng chỗ`}}
  if(q.type==='matrix'){const rows=q.rows.map((r,ri)=>r.ans.every((a,ci)=>v[ri][ci]===a));const k=rows.filter(Boolean).length;return {ok:k===q.rows.length,msg:`${k}/${q.rows.length} dòng đúng`,rows}}
  if(q.type==='highlight'||q.type==='picks'){const L=q.segs||q.items,need=L.filter(s=>s.on===1).length,hit=L.filter((s,i)=>s.on===1&&v[i]).length,wrong=L.filter((s,i)=>s.on===0&&v[i]).length;return {ok:hit===need&&!wrong,msg:`Đúng ${hit}/${need}${wrong?`, chọn nhầm ${wrong}`:''}`}}
  if(q.type==='sort'){const items=q.items.map((it,i)=>it.ans.includes(v.c[i])&&(!it.hard||String(v.w[i]||'').trim().length>=8));const k=items.filter(Boolean).length;return {ok:k===q.items.length,msg:`${k}/${q.items.length} đúng${q.items.some((it,i)=>it.hard&&String(v.w[i]||'').trim().length<8)?', thiếu lý do ở bài ★':''}`,items}}
  if(q.type==='headline'){const c=headlineChecks(v);return {ok:c.every(x=>x[0]),msg:'Tít chưa đạt yêu cầu'}}
  if(q.type==='checks'){const miss=q.items.filter((it,i)=>it.need===1&&!v[i]).length,bad=q.items.filter((it,i)=>it.need===-1&&v[i]);
    const notes=[];if(miss)notes.push(`Chị Diệp: “Em còn thiếu ${miss} câu quan trọng đã kiểm chứng.”`);bad.forEach(it=>notes.push(`Chị Diệp: “Bỏ câu ‘${it.t}’ ra, vì ${it.why}.”`));
    return {ok:!miss&&!bad.length,msg:'Chưa ổn',notes}}
  if(q.type==='compose'){const c=composeChecks(v.t,v.b);return {ok:c.every(x=>x[0]),msg:`Còn ${c.filter(x=>!x[0]).length} yêu cầu chưa đạt`}}
}
function hintsHTML(key,h){const u=S.hints[key]||0;return `<div class="hints">${h.slice(0,u).map(x=>`<div class="hint">${x}</div>`).join('')}${u<h.length?`<button class="btn small ghost" id="hintBtn">Hỏi chị Diệp gợi ý ${u+1}/${h.length} (−10 điểm)</button>`:''}</div>`}
function stash(qs,key){qs.forEach((q,qi)=>{let v=readQ(q,qi,key);if(q.type==='sort')v={c:v.c,w:v.w};S.draft[`q${key}_${qi}`]=v});save()}
function bindQs(qs,key){

  app.querySelectorAll('.q input[type=text],.q textarea').forEach(el=>el.addEventListener('input',()=>{stash(qs,key);
    qs.forEach((q,qi)=>{const id=`q${key}_${qi}`,ck=document.getElementById('ck_'+id);if(!ck)return;

const FORM='https://docs.google.com/forms/d/e/1FAIpQLScs6hWIg-LNJs6TFdgRT0b0M6ENA1-JaQnddGGpRBVlOuPs2A/formResponse';
function fmtTime(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return `${m}:${String(s).padStart(2,'0')}`}
function code(){const t=fmtTime((S.end||Date.now())-S.start),b=`${S.team}|${totalScore()}|${t}`;let h=7;for(const c of b)h=(h*31+c.charCodeAt(0))%46656;return `${totalScore()}Đ · ${t} · ${h.toString(36).toUpperCase().padStart(3,'0')}`}
function detailText(){
  const note=k=>{const f=S.fails[k]||0,h=S.hints[k]||0,a=[];if(f)a.push(`nộp sai ${f} lần`);if(h)a.push(`xem ${h} gợi ý`);return a.length?` (${a.join(', ')})`:''};
  const js=judgeStats(),fp=footprint();
  const L=STAGES.map((W,i)=>`Chặng ${W.ch}${W.part?' (xuất bản)':''} · ${W.title}: ${S.done[i]??0}/${BASE(i)}${note(String(i))}`);
  L.push(`Độ tỉnh táo khi đọc bình luận: ${js.pct}/100`);
  L.push(`Đã chia sẻ ${fp.sf} tin xuyên tạc/sai lệch · ${fp.sh} tin ác ý, nội dung gây hại · đã gỡ ${fp.undone} · đã thích ${fp.lf} bài sai`);
  L.push(`Tổng: ${totalScore()} điểm · Thời gian: ${fmtTime((S.end||Date.now())-S.start)}`);

function sendResult(){
  const f=new URLSearchParams();

  f.append('entry.932556584',String(Math.round(((S.end||Date.now())-S.start)/1000)));f.append('entry.549997770',code());f.append('entry.1228198398',detailText());

   <p class="tip">${S.sent==='ok'?'Kết quả đã được gửi đi. Đọc mã này cho giảng viên để đối chiếu.':inflight?'Đang gửi kết quả…':'Chưa gửi được kết quả (có thể do mất mạng). Bấm gửi lại, hoặc đọc mã này cho giảng viên.'}</p>
   ${S.sent!=='ok'&&!inflight?'<button class="btn small" id="resend">Gửi lại kết quả</button>':''}</div>
  <div class="box"><span class="k">ĐỘI ĐÃ LÀM GÌ TRÊN BẢNG TIN</span><ul class="fp">${fpList}</ul>
   <p class="tip">Chia sẻ tin xuyên tạc, tin sai lệch: −10 điểm mỗi lần. Chia sẻ tin ác ý, nội dung gây hại cho người khác: −15. Gỡ bài sau đó được cộng lại 3 điểm, nhưng lần chia sẻ vẫn được tính. Thích bài sai: −3.</p></div>
  <div class="box"><span class="k">BẢN TIN CỦA ĐỘI</span>${articleHTML()}</div>
  <div class="box"><span class="k">CHUYỆN THẬT ĐÊM 14/10</span><ul class="truth">
   <li><span class="tm">21:15</span><span>Huy nhắn “tao xử nó rồi” trong nhóm chơi game, nói về con trùm trong game.</span></li>
   <li><span class="tm">22:50</span><span>An nhắn nhờ cả phòng nhỏ tiếng, rồi hai bạn cự cãi. An bỏ ra cầu thang.</span></li>
   <li><span class="tm">22:58</span><span>An trượt chân ở bậc vừa lau, ngồi ôm trán. Huy chạy ra cõng An xuống, gọi taxi.</span></li>
   <li><span class="tm">23:20</span><span>An nhập viện: rách trán khâu 4 mũi, bong gân cổ chân.</span></li>
   <li><span class="tm">23:31</span><span>Khánh Vy gửi clip vào nhóm tự quản, 9 phút sau nhắn lại là té cầu thang.</span></li>
   <li><span class="tm">23:58</span><span>Ngô Thanh Tuấn, quản trị Hóng Biến, cắt clip và đăng kèm lời kể “đánh hội đồng”.</span></li>
   <li><span class="tm">18/10</span><span>Người quản trị trang bị xử phạt hành chính, các bài sai bị gỡ.</span></li></ul></div>
  <div class="row" style="justify-content:center"><button class="linkbtn" id="back">← Xem lại các chặng</button><button class="linkbtn" id="reset">Chơi lại từ đầu</button></div></div>`;
  const rs=$('#resend');if(rs)rs.onclick=()=>{rs.disabled=true;sendResult();renderResult()};
  $('#back').onclick=()=>go('play',0);
  bindReset();
}

/* ---------------- ÂM THANH ---------------- */
let AC=null, viVoice=null, voiceWarned=false, stopAll=()=>{};
function pickVoice(){try{const v=speechSynthesis.getVoices();viVoice=v.find(x=>/^vi/i.test(x.lang))||null}catch(e){}}
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function noiseSrc(ctx,secs){const b=ctx.createBuffer(1,ctx.sampleRate*secs,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;return s}
function ambience(kind,dur){const ctx=ac();if(!ctx)return null;const t=ctx.currentTime,out=ctx.createGain();out.connect(ctx.destination);
  const n=noiseSrc(ctx,dur+.5),f=ctx.createBiquadFilter();
  if(kind==='night'){f.type='lowpass';f.frequency.value=380;out.gain.value=.05}
  if(kind==='crowd'){f.type='bandpass';f.frequency.value=900;f.Q.value=.7;out.gain.value=.22}
  if(kind==='room'){f.type='lowpass';f.frequency.value=200;out.gain.value=.025}
  n.connect(f);f.connect(out);n.start(t);
  if(kind==='crowd'){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.7;lg.gain.value=.08;l.connect(lg);lg.connect(out.gain);l.start(t)}
  out.gain.setValueAtTime(out.gain.value,t+dur-.4);out.gain.linearRampToValueAtTime(0,t+dur);return ()=>{try{n.stop()}catch(e){};out.disconnect()}}
function scream(delay){const ctx=ac();if(!ctx)return;const t=ctx.currentTime+delay;
  [[0,1.0],[1.15,.8]].forEach(([o,len])=>{const os=ctx.createOscillator(),g=ctx.createGain(),bp=ctx.createBiquadFilter(),vib=ctx.createOscillator(),vg=ctx.createGain();
   os.type='sawtooth';os.frequency.setValueAtTime(340,t+o);os.frequency.linearRampToValueAtTime(470,t+o+.25);os.frequency.linearRampToValueAtTime(360,t+o+len);
   vib.frequency.value=7;vg.gain.value=14;vib.connect(vg);vg.connect(os.frequency);
   bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=1.4;
   g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.18,t+o+.06);g.gain.linearRampToValueAtTime(.12,t+o+len*.7);g.gain.linearRampToValueAtTime(0,t+o+len);
   os.connect(bp);bp.connect(g);g.connect(ctx.destination);os.start(t+o);vib.start(t+o);os.stop(t+o+len+.05);vib.stop(t+o+len+.05)})}
function say(text,pitch){try{const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';if(viVoice)u.voice=viVoice;u.rate=1.05;u.pitch=pitch||1;speechSynthesis.speak(u)}catch(e){}}
function bindVideos(root){
  root.querySelectorAll('[data-vid]').forEach(el=>{
    const m=MEDIA[el.dataset.vid],sub=el.querySelector('.vsub'),play=el.querySelector('.vplay');
    play.onclick=()=>{
      stopAll();
      (el._t||[]).forEach(clearTimeout);el.classList.remove('playing');void el.offsetWidth;el.classList.add('playing');sub.textContent='';
      let stopAmb=null;const snd=m.sound;
      if(snd){stopAmb=ambience(snd.amb,m.dur);(snd.fx||[]).forEach(([t,k])=>{if(k==='scream')scream(t)});}
      el._t=m.subs.map(([t,s])=>setTimeout(()=>sub.textContent=s,t*1000));
      const end=()=>{(el._t||[]).forEach(clearTimeout);el.classList.remove('playing');play.textContent='↻';play.setAttribute('aria-label','Xem lại');sub.textContent='';if(stopAmb)stopAmb()};
      el._t.push(setTimeout(end,m.dur*1000+300));
      stopAll=end;
    };
  });
}

/* =====================================================================
   TẤM TRƯỢT: TRA CỨU, SỔ TAY, BÀI BÁO
   ===================================================================== */
function sheet(html,after){$('#sheetRoot').innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#sbg').onclick=e=>{if(e.target.id==='sbg'||e.target.closest('[data-close]'))closeSheet()};if(after)after();}
function closeSheet(){stopAll();$('#sheetRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const curW=()=>S.view==='play'||S.view==='intro'?S.stage:9;
let T={tab:'search',q:'',img:null,dom:''};
function openTools(tab,q,img){T.tab=tab||'search';if(q!=null)T.q=q;if(img)T.img=img;drawTools()}
function drawTools(){
  const tabs=[['search','Tìm kiếm'],['img','Tìm ảnh gốc'],['dom','Tra chủ trang web']];
  let body='';
  if(T.tab==='search') body=`<form class="sbar" id="sf"><input type="text" id="sq" value="${esc(T.q)}" placeholder="Tên trang, @tài khoản, họ tên, số điện thoại…" autocomplete="off"><button class="btn small" type="submit">Tìm</button></form>
   <p class="tip">Gõ đúng những gì bạn nhặt được trên bảng tin: một tên trang, một @tài khoản, một họ tên, một số điện thoại.</p><div class="stack" id="sres"></div>`;
  if(T.tab==='img'){const seen=S.seen.filter(k=>MEDIA[k]);
   body=seen.length?`<p class="tip">Chọn một ảnh hoặc clip bạn đã thấy trên bảng tin để tìm lần xuất hiện đầu tiên của nó.</p><div class="thumbs">${seen.map(k=>{const m=MEDIA[k];return `<button data-pick="${k}" aria-pressed="${T.img===k}" title="${m.label}">${m.svg?m.svg():`<span class="tlabel">${m.label}</span>`}</button>`}).join('')}</div><div id="ires"></div>`
   :'<p class="muted">Chưa có ảnh nào. Lướt bảng tin trước đã.</p>';}
  if(T.tab==='dom') body=`<form class="sbar" id="df"><input type="text" id="dq" value="${esc(T.dom)}" placeholder="Ví dụ: tinsieunong.net" autocomplete="off"><button class="btn small" type="submit">Tra</button></form>
   <p class="tip">Gõ địa chỉ trang web để biết ai, tổ chức nào đứng tên trang đó.</p><div id="dres"></div>`;
  sheet(`<div class="sh"><h3>Kiểm tra</h3><button class="close" data-close aria-label="Đóng">×</button></div>
   <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${T.tab===k}">${l}</button>`).join('')}</div>${body}`,()=>{
   document.querySelectorAll('#sheetRoot [data-tab]').forEach(b=>b.onclick=()=>{T.tab=b.dataset.tab;drawTools()});
   if(T.tab==='search'){$('#sf').onsubmit=e=>{e.preventDefault();T.q=$('#sq').value;doSearch()};if(T.q)doSearch()}
   if(T.tab==='img'){document.querySelectorAll('#sheetRoot [data-pick]').forEach(b=>b.onclick=()=>{T.img=b.dataset.pick;drawTools()});if(T.img&&MEDIA[T.img]){const m=MEDIA[T.img];$('#ires').innerHTML=`<div class="box"><span class="k">KẾT QUẢ CHO: ${m.label.toUpperCase()}</span>${m.rev}</div>`}}
   if(T.tab==='dom'){$('#df').onsubmit=e=>{e.preventDefault();T.dom=$('#dq').value;doDomain()};if(T.dom)doDomain()}
  });
}
function doSearch(){
  const q=norm(T.q),box=$('#sres');if(!box)return;
  if(q.length<3){box.innerHTML='<p class="tip">Gõ ít nhất 3 ký tự.</p>';return}
  const w=curW(),hit=kw=>kw.some(k=>{const kk=norm(k);if(kk.length<3)return false;return q.includes(kk)||(q.length>=4&&kk.includes(q))});
  const res=[];
  Object.entries(DOCS).forEach(([id,d])=>{if(d.w<=w&&hit(d.kw))res.push({type:'doc',id,t:d.t,src:d.src,x:d.html(w)})});
  Object.entries(ARTS).forEach(([id,a])=>{if(a.w<=w&&hit(a.kw))res.push({type:'art',id,t:a.t,src:a.src,x:''})});
  Object.entries(POSTS).forEach(([id,p])=>{if((POST_STAGE[id]??99)<=w&&p.kw.length&&hit(p.kw.concat([p.who,p.handle||''])))res.push({type:'post',id,t:`${p.who} · ${p.time}`,src:`${p.plat}${p.handle?' · '+p.handle:''}`,x:p.text})});
  box.innerHTML=res.length?res.map(r=>{const tmp=document.createElement('div');tmp.innerHTML=r.x;const sn=tmp.textContent.replace(/\s+/g,' ').trim().slice(0,110);
    return `<button class="result" data-open="${r.type}:${r.id}"><div class="rs">${r.src}</div><div class="rt">${r.t}</div>${sn?`<div class="rx">${esc(sn)}…</div>`:''}</button>`}).join('')
   :`<div class="box"><b>Không có kết quả.</b><p class="tip">Thử từ khóa khác lấy từ bảng tin: tên trang, @tài khoản, họ tên, tên bệnh viện, tên công ty, số điện thoại.</p></div>`;
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.open.split(':');
    openItem(`${t}:${id}`,true);});
}
function doDomain(){const d=T.dom.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split(/[\/\s?#]/)[0];
  $('#dres').innerHTML=`<div class="box"><span class="k">CHỦ TRANG WEB · ${esc(d)}</span>${DOMAINS[d]?DOMAINS[d](curW()):'<p>Không tìm thấy thông tin đăng ký cho địa chỉ này. Kiểm tra lại chính tả, ví dụ: tinsieunong.net</p>'}</div>`}
function openItem(m,back){const [t,id]=m.split(':');let src,inner;
  if(t==='post'){const p=POSTS[id];src=`${p.plat} · ${p.time}`;inner=postHTML(id)}
  else if(t==='art'){const a=ARTS[id];src=a.src;inner=a.html()}
  else {const d=DOCS[id];src=d.src;inner=`<div class="box"><b>${d.t}</b>${d.html(curW())}</div>`}
  const sv=S.saved.includes(m);
  sheet(`<div class="sh">${back?'<button class="linkbtn" id="bk">← Quay lại kết quả</button>':`<span class="tip">${src}</span>`}<button class="close" data-close aria-label="Đóng">×</button></div>${inner}
   <button class="btn ${sv?'ghost':''}" id="savebtn">${sv?'Đã lưu · bấm để bỏ':'Lưu vào hồ sơ'}</button>`,()=>{
   const b=$('#bk');if(b)b.onclick=()=>drawTools();bindPosts($('#sheetRoot'));save();
   $('#savebtn').onclick=()=>{if(S.saved.includes(m))S.saved=S.saved.filter(x=>x!==m);else S.saved.push(m);save();openItem(m,back);$('#clueCount').textContent=''}});
}
render();
</script>
