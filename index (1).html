<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ai thả tin?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: một cột kiểu "bàn kiểm chứng" trên điện thoại; thanh trên cố định, thanh điều hướng dưới, bút dạ quang đánh dấu manh mối */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E7EE; --ink:#15203A; --muted:#5A6378; --line:#D2D8E2;
  --hl:#FFE066; --hl-ink:#15203A; --accent:#1D4ED8; --accent-ink:#FFFFFF;
  --ok:#1E7A4C; --ok-bg:#E2F3EA; --bad:#C2183A; --bad-bg:#FBE4E9;
  --threads:#101010;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#171F2E; --sunk:#111827; --ink:#E7EBF2; --muted:#9AA4B7; --line:#2A3448;
  --hl:#F2C230; --hl-ink:#111827; --accent:#7AA2FF; --accent-ink:#0E1420;
  --ok:#5BD49A; --ok-bg:#12321F; --bad:#FF7088; --bad-bg:#3A1620; --threads:#E7EBF2; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#171F2E; --sunk:#111827; --ink:#E7EBF2; --muted:#9AA4B7; --line:#2A3448;
  --hl:#F2C230; --hl-ink:#111827; --accent:#7AA2FF; --accent-ink:#0E1420;
  --ok:#5BD49A; --ok-bg:#12321F; --bad:#FF7088; --bad-bg:#3A1620; --threads:#E7EBF2; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:0 110px}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%, var(--hl) 55%);color:inherit;padding:0 2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-weight:800;letter-spacing:.02em;font-size:17px}
.brand span{background:var(--hl);color:var(--hl-ink);padding:0 4px;border-radius:3px}
.top .team{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.score{font-family:var(--f-mono);font-weight:700;font-size:14px;padding:4px 10px;border:1.5px solid var(--ink);border-radius:999px;white-space:nowrap}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button .ic{font-family:var(--f-mono);font-size:15px}
.nav button[aria-current="true"]{color:var(--ink);background:var(--sunk)}

/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
label.lbl{font-weight:600;font-size:14px;display:block;margin-bottom:6px}

/* intro */
.hero h1{font-size:clamp(34px,10vw,48px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:var(--hl);color:var(--hl-ink);padding:0 6px;border-radius:4px}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.thread .who{display:flex;gap:10px;align-items:center}
.ava{width:36px;height:36px;border-radius:50%;background:var(--threads);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.thread .h{font-weight:700;font-size:14px}
.thread .t{font-size:12px;color:var(--muted)}
.thread p{margin-top:8px}
.meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.spread{list-style:none;margin:0;padding:0;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:12px}
.spread li{position:relative;padding-left:16px}
.spread li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.spread .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.views{font-family:var(--f-mono);font-weight:700;font-size:22px}

/* media placeholders */
.media{border-radius:8px;border:1px solid var(--line);background:
  repeating-linear-gradient(135deg,var(--sunk) 0 10px,var(--surface) 10px 20px);padding:18px 14px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.media .cap{font-weight:600;font-size:14px}
.media .wm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.media .id{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* hub */
.stage-list{display:flex;flex-direction:column;gap:10px}
.st{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%}
.st .n{font-family:var(--f-mono);font-weight:700;font-size:20px;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--sunk)}
.st .nm{font-weight:700}
.st .sub{font-size:13px;color:var(--muted)}
.st .badge{font-size:12px;font-weight:700;font-family:var(--f-mono);white-space:nowrap}
.st.done .n{background:var(--ok-bg);color:var(--ok)}
.st.done .badge{color:var(--ok)}
.st.locked{opacity:.5;cursor:not-allowed}
.st.open{border-color:var(--ink);border-width:1.5px}

/* stage */
.brief{font-size:15px}
.mat{display:flex;flex-direction:column;gap:8px}
.docbtn{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;background:var(--sunk);border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
.docbtn .dt{font-weight:600;font-size:14px;min-width:0}
.docbtn .ds{font-size:12px;color:var(--muted);display:block}
.docbtn .go{font-family:var(--f-mono);font-size:13px;color:var(--accent);flex:none}
.q{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.q .qp{font-weight:700}
.q .res{font-size:13px;font-weight:700;font-family:var(--f-mono)}
.q .res.ok{color:var(--ok)} .q .res.bad{color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:10px 12px;cursor:pointer;border:1.5px solid transparent}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent)}
.cls{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cls .ct{font-size:14px}
.cls .cs{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.mrow{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mrow .ml{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .x{font-family:var(--f-mono)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.75}
.seg{display:inline;background:none;border:0;padding:1px 2px;text-align:left;cursor:pointer;border-bottom:1px dotted var(--muted);font-size:15px;line-height:1.75}
.seg.big{font-weight:800}
.seg.ad{font-family:var(--f-mono);font-size:13px}
.seg[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-bottom-color:transparent;border-radius:3px}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{font-size:14px;background:var(--sunk);border-left:3px solid var(--hl);padding:8px 12px;border-radius:0 8px 8px 0}
.done-box{border:2px solid var(--ok);background:var(--ok-bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.done-box .stamp{font-family:var(--f-mono);font-weight:700;color:var(--ok);letter-spacing:.08em}
.frag{background:var(--surface);border:1px dashed var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.frag b{font-family:var(--f-mono);font-size:12px;display:block;color:var(--muted);font-weight:700}

/* search */
.seg-ctl{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg-ctl button{border:0;background:none;border-radius:7px;padding:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.sbar{display:flex;gap:8px}
.sbar input{flex:1;min-width:0}
.result{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.result .rs{font-family:var(--f-mono);font-size:12px;color:var(--ok)}
.result .rt{font-weight:700;color:var(--accent)}
.result .rx{font-size:13px;color:var(--muted);margin-top:2px}
.tip{font-size:13px;color:var(--muted)}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.rev .rh{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet .src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
.doc table{width:100%;border-collapse:collapse;font-size:14px}
.doc td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:top}
.doc td:first-child{color:var(--muted);width:38%}
.doc .say{border-left:3px solid var(--line);padding-left:10px}
.doc .msg{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px}
.doc .msg .mt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.doc .adbox{font-family:var(--f-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);padding:6px 8px;border-radius:6px}
.close{background:var(--sunk);border:0;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}

.result-code{font-family:var(--f-mono);font-weight:700;font-size:clamp(18px,6vw,26px);background:var(--hl);color:var(--hl-ink);padding:12px;border-radius:8px;text-align:center;overflow-wrap:anywhere}
.truth{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.truth li{display:grid;grid-template-columns:52px 1fr;gap:8px}
.truth .tm{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.foot{display:flex;justify-content:center;margin-top:28px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  .done-box{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<nav class="nav" id="nav" hidden>
  <button data-tab="tasks"><span class="ic">▤</span>Nhiệm vụ</button>
  <button data-tab="search"><span class="ic">⌕</span>Tra cứu</button>
  <button data-tab="clues"><span class="ic">✎</span>Manh mối <span id="clueCount" class="mono"></span></button>
</nav>
<div id="sheetRoot"></div>

<script>
/* ============ DỮ LIỆU: "mạng internet thu nhỏ" (toàn bộ là hư cấu) ============ */
const IMAGES = {
  IMG01:{cap:'Ảnh vệt máu loang trên sàn gạch', where:'tinsieunong.net, bài 01:15 ngày 15/10',
    rev:`<div class="rh">KẾT QUẢ SỚM NHẤT · 12/03/2024</div><p><b>Báo Đông Nam Bộ Online (giả lập)</b>: “Công nhân bị thương do máy cưa tại một xưởng gỗ”, cách Hòa Lâm hơn 100 km.</p><p class="muted">Bản gốc có độ phân giải cao hơn, cùng góc chụp, cùng vết nứt trên viên gạch. Có thêm 27 kết quả khác, tất cả đăng sau 0h ngày 15/10/2026.</p>`},
  IMG02:{cap:'Khung hình trong clip “đánh hội đồng”', where:'tinsieunong.net, clip 0:12 ghép cuối bài',
    rev:`<div class="rh">KẾT QUẢ SỚM NHẤT · 09/05/2025</div><p>Clip “Nữ sinh THCS đánh nhau sau giờ học” ở một trường tại miền Tây, nhiều báo đã đưa tin năm 2025.</p><p class="muted">Bối cảnh là sân trường có cột cờ và đồng phục áo dài trắng, không phải hành lang KTX nam.</p>`},
  IMG03:{cap:'Ảnh “giấy chuyển viện” ghi: hôn mê sâu, chuyển tuyến trên', where:'Threads @hongbien.hoalam, 00:41 ngày 15/10',
    rev:`<div class="rh">KHÔNG CÓ BẢN TRÙNG KHỚP TRƯỚC 15/10/2026</div><p>Ảnh tương tự: “Mẫu giấy chuyển tuyến (mẫu cũ, dùng trước năm 2023)” trên một trang chia sẻ biểu mẫu.</p><p class="muted">Phần chữ điền tay lệch dòng so với khung kẻ, dấu hiệu chèn chữ bằng phần mềm.</p>`},
  IMG04:{cap:'Ảnh An băng trán, ngồi trên giường bệnh', where:'Tin Sáng Phương Nam, 16:05 ngày 15/10',
    rev:`<div class="rh">KẾT QUẢ SỚM NHẤT · 15/10/2026 16:05</div><p><b>Tin Sáng Phương Nam</b>, chú thích: “Ảnh do gia đình sinh viên cung cấp”.</p><p class="muted">Không có lần xuất hiện nào sớm hơn.</p>`}
};
function media(id, extra=''){const m=IMAGES[id];return `<div class="media" data-media="${id}"><span class="id">${id}</span><span class="cap">[Ảnh] ${m.cap}</span>${extra}<button class="btn small ghost" data-rev="${id}">Tra ảnh này →</button></div>`}

const DOCS = {
  hb_post:{t:'Bài đăng của Hóng Biến Hòa Lâm', src:'Threads · @hongbien.hoalam · 14/10, 23:58',
    kw:['hongbien','hong bien','danh hoi dong','le minh an','minh an','ktx hoa lam','ktx khu c'],
    body:()=>`<p>NÓNG!!! Nam sinh năm nhất <b>Lê Minh An</b> ở KTX khu C bị bạn cùng phòng <b>TRỊNH GIA HUY</b> và đồng bọn đánh hội đồng tới chấn thương sọ não, đang hôn mê. Nghe nói nhà thằng Huy giàu lắm, đã “lo” xong cho trường rồi nên trường im re. Clip đây, ai có thêm thông tin inbox page!!</p>
    <div class="media"><span class="cap">▶ Clip 0:38 · quay từ tòa nhà đối diện, trời tối, có tiếng la</span><span class="wm">Chữ in mờ góc phải clip: @khanhvy.do</span></div>
    <p class="meta">8,4K thích · 2,1K trích dẫn · 5,6K đăng lại</p>`},
  hb_about:{t:'Hóng Biến Hòa Lâm · Giới thiệu trang', src:'Trang · 48,2K người theo dõi',
    kw:['hong bien hoa lam','hongbien.hoalam','gioi thieu','trang hong bien','tuan ngo'],
    body:()=>`<table>
    <tr><td>Hạng mục</td><td><b>Trang kinh doanh · Truyền thông/Quảng cáo</b></td></tr>
    <tr><td>Ngày tạo</td><td>03/2024</td></tr>
    <tr><td>Lịch sử đổi tên</td><td>“Shop Phụ Kiện Tuấn Ngô” → “Confession HLU” → “Hóng Biến Hòa Lâm”</td></tr>
    <tr><td>Liên hệ</td><td>Nhận book quảng cáo, đẩy bài, review: <span class="mono">Zalo 0909 *** 731</span></td></tr>
    <tr><td>Trang web</td><td class="mono">tinsieunong.net</td></tr>
    <tr><td>Quản trị viên</td><td>1 người · đặt tại Việt Nam</td></tr></table>`},
  hb_giay:{t:'Hóng Biến Hòa Lâm đăng “giấy chuyển viện”', src:'Threads · @hongbien.hoalam · 15/10, 00:41',
    kw:['hongbien','hong bien'],
    body:()=>`<p>CẬP NHẬT: Giấy chuyển viện của An đây. HÔN MÊ SÂU, phải chuyển tuyến trên. Vậy mà trường bảo “đang ổn định”??? Tiền đúng là mua được tất cả.</p>${media('IMG03')}<p>👉 Đọc toàn bộ diễn biến: <span class="mono">tinsieunong.net/vu-an-hla</span></p><p class="meta">11K thích · 7,9K đăng lại</p>`},
  tinsang:{t:'ĐH Hòa Lâm: sinh viên bị thương ở KTX, bệnh viện xác nhận đã xuất viện', src:'Tin Sáng Phương Nam · Phóng viên Hồ Thanh Mai · 15/10, 16:05',

    body:()=>`<p>Tối 14/10, sinh viên năm nhất L.M.A. (19 tuổi) bị thương khi đi xuống cầu thang tầng 3 tòa C2, KTX khu C Trường ĐH Hòa Lâm.</p>

const KEY='aithatin.v1';
let S=load()||fresh();
function fresh(){return {team:'',start:0,end:0,stage:{},hints:{},fails:{},saved:[],seen:[],draft:{},view:'intro',cur:null,note:''}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const solved=i=>S.stage[i]!=null;
const total=()=>Object.values(S.stage).reduce((a,b)=>a+b,0);
const norm=s=>(s||'').toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9.@ ]/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const app=$('#app');

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ============ KHUNG ============ */
function topbar(){return `<header class="top"><div class="brand">AI THẢ <span>TIN?</span></div><div class="team">${esc(S.team)}</div><div class="score">${total()} đ</div></header>`}
function setNav(tab){const n=$('#nav');n.hidden=S.view==='intro';n.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'true':'false'));
  const c=S.stage? Object.keys(S.stage).length + S.saved.length:0; $('#clueCount').textContent=c?`(${c})`:''}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.tab;
  if(t==='tasks'){S.view=S.cur!=null?'stage':'hub'} else S.view=t; save(); render(); window.scrollTo(0,0)});

function render(){
  const v=S.view;
  if(v==='intro') return renderIntro();
  if(v==='hub') return renderHub();
  if(v==='stage') return S.cur==='final'?renderFinal():renderStage(S.cur);
  if(v==='search') return renderSearch();
  if(v==='clues') return renderClues();
  if(v==='result') return renderResult();
}

/* ============ CHẶNG ============ */
function qHTML(q,qi,sk){
  const id=`q${sk}_${qi}`, d=S.draft[id];
  let inner='';
  if(q.type==='choice') inner=q.options.map((o,oi)=>`<label class="opt"><input type="radio" name="${id}" value="${oi}" ${d===oi?'checked':''}><span>${o}</span></label>`).join('');
  if(q.type==='text') inner=`<input type="text" id="${id}" placeholder="${q.ph||''}" value="${esc(d||'')}">`;
  if(q.type==='classify') inner=q.items.map((it,ii)=>`<div class="cls"><div class="cs">${it.src}</div><div class="ct">${it.html}</div>
     <select id="${id}_${ii}" aria-label="Phân loại"><option value="">— Chọn —</option>${q.options.map((o,oi)=>`<option value="${oi}" ${d&&d[ii]===oi?'selected':''}>${o}</option>`).join('')}</select></div>`).join('');
  if(q.type==='matrix') inner=q.rows.map((r,ri)=>`<div class="mrow"><div class="ml">${r.label}</div><div class="chips">${q.cols.map((c,ci)=>`<button class="chip" data-m="${id}" data-r="${ri}" data-c="${ci}" aria-pressed="${d&&d[ri]&&d[ri][ci]?'true':'false'}">${c}</button>`).join('')}</div></div>`).join('');
  if(q.type==='highlight') inner=`<div class="paper">${q.segs.map((s,si)=>`<button class="seg ${s.cls||''}" data-h="${id}" data-s="${si}" aria-pressed="${d&&d[si]?'true':'false'}">${s.t}</button>${s.br?'<br>':' '}`).join('')}</div>`;
  return `<div class="q" data-q="${id}"><div class="row" style="justify-content:space-between"><span class="qp">${qi+1}. ${q.prompt}</span><span class="res" id="r_${id}"></span></div>${inner}</div>`;
}
function readQ(q,qi,sk){
  const id=`q${sk}_${qi}`;
  if(q.type==='choice'){const c=app.querySelector(`input[name="${id}"]:checked`);return c?+c.value:null}
  if(q.type==='text') return $('#'+id).value;
  if(q.type==='classify') return q.items.map((_,ii)=>{const v=$(`#${id}_${ii}`).value;return v===''?null:+v});
  if(q.type==='matrix') return q.rows.map((r,ri)=>q.cols.map((c,ci)=>app.querySelector(`[data-m="${id}"][data-r="${ri}"][data-c="${ci}"]`).getAttribute('aria-pressed')==='true'?1:0));
  if(q.type==='highlight') return q.segs.map((s,si)=>app.querySelector(`[data-h="${id}"][data-s="${si}"]`).getAttribute('aria-pressed')==='true'?1:0);
}
function checkQ(q,v){
  if(q.type==='choice') return {ok:v===q.ans};
  if(q.type==='text'){const n=norm(v);return {ok:q.accept.some(a=>n.includes(a))}}
  if(q.type==='classify'){const k=q.items.filter((it,i)=>v[i]===it.ans).length;return {ok:k===q.items.length,msg:`${k}/${q.items.length} đúng`}}
  if(q.type==='matrix'){let k=0,n=0;q.rows.forEach((r,ri)=>r.ans.forEach((a,ci)=>{n++;if(v[ri][ci]===a)k++}));return {ok:k===n,msg:`${k}/${n} ô đúng`}}
  if(q.type==='highlight'){const need=q.segs.filter(s=>s.on).length;const hit=q.segs.filter((s,i)=>s.on&&v[i]).length;const wrong=q.segs.filter((s,i)=>!s.on&&v[i]).length;
    return {ok:hit===need&&!wrong,msg:`Đúng ${hit}/${need}${wrong?`, chọn nhầm ${wrong}`:''}`}}
}
function bindInputs(qs,sk){
  app.querySelectorAll('.chip,.seg').forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');stash(qs,sk)});
  app.querySelectorAll('.q input,.q select').forEach(el=>el.addEventListener('change',()=>stash(qs,sk)));
  app.querySelectorAll('.q input[type=text]').forEach(el=>el.addEventListener('input',()=>stash(qs,sk)));
}
function stash(qs,sk){qs.forEach((q,qi)=>{S.draft[`q${sk}_${qi}`]=readQ(q,qi,sk)});save()}

function matsHTML(ids){return ids.map(id=>`<button class="docbtn" data-doc="${id}"><span class="dt">${DOCS[id].t}<span class="ds">${DOCS[id].src}</span></span><span class="go">Mở →</span></button>`).join('')}
function hintsHTML(key,hints){const used=S.hints[key]||0;
  return `<div class="hints">${hints.slice(0,used).map(h=>`<div class="hint">${h}</div>`).join('')}${used<hints.length?`<button class="btn small ghost" id="hintBtn">Mở gợi ý ${used+1}/${hints.length} (−15 đ)</button>`:''}</div>`}
function stageScore(key,base){return Math.max(Math.round(base*0.3), base-10*(S.fails[key]||0)-15*(S.hints[key]||0))}

function renderStage(i){
  const s=STAGES[i], key=String(i), done=solved(i);
  app.innerHTML=topbar()+`<div class="stack">
  <button class="linkbtn" id="back" style="align-self:flex-start">← Bản đồ chặng</button>
  <div><div class="kicker">Chặng ${i+1}/5</div><h2 style="font-size:24px;margin-top:4px">${s.name}</h2></div>
  <p class="brief">${s.brief}</p>
  <div class="card stack"><div class="kicker">Tư liệu được giao</div><div class="mat">${matsHTML(s.mats)}</div>
   <p class="tip">Cần thêm thông tin? Mở thẻ <b>Tra cứu</b> ở thanh dưới.</p></div>
  ${done?doneBox(s,S.stage[i]):`<div class="card stack">${s.qs.map((q,qi)=>qHTML(q,qi,key)).join('')}
   <button class="btn block" id="submit">Nộp đáp án</button>${hintsHTML(key,s.hints)}</div>`}
  </div>`;
  setNav('tasks');
  $('#back').onclick=()=>{S.cur=null;S.view='hub';save();render()};
  bindDocs(app); s.mats.forEach(m=>markSeen(m));
  if(done){const n=$('#next');if(n)n.onclick=()=>{S.cur=i+1<STAGES.length?i+1:'final';save();render();window.scrollTo(0,0)};return}
  bindInputs(s.qs,key);
  $('#submit').onclick=()=>submit(s.qs,key,100,()=>{S.stage[i]=stageScore(key,100);save();render();window.scrollTo(0,0)});
  const hb=$('#hintBtn'); if(hb)hb.onclick=()=>{S.hints[key]=(S.hints[key]||0)+1;stash(s.qs,key);save();render()};
}
function doneBox(s,pts){return `<div class="done-box"><div class="stamp">✓ ĐÃ KIỂM CHỨNG · +${pts} đ</div>
  <div class="frag"><b>MẢNH GHÉP MỚI</b>${s.frag}</div><p style="font-size:14px">${s.lesson}</p>
  <button class="btn" id="next">Sang chặng tiếp →</button></div>`}
function submit(qs,key,base,onWin){
  const vals=qs.map((q,qi)=>readQ(q,qi,key));
  if(vals.some((v,qi)=>v==null||(qs[qi].type==='text'&&!String(v).trim())||(qs[qi].type==='classify'&&v.includes(null)))){toast('Còn câu chưa trả lời');return}
  let all=true;
  qs.forEach((q,qi)=>{const r=checkQ(q,vals[qi]);const el=$(`#r_q${key}_${qi}`);el.className='res '+(r.ok?'ok':'bad');el.textContent=r.ok?'✓ Đúng':'✗ '+(r.msg||'Chưa đúng');if(!r.ok)all=false});
  if(all){onWin();toast('Đã mở khóa mảnh ghép!')}else{S.fails[key]=(S.fails[key]||0)+1;save();toast('Có câu chưa đúng, −10 đ. Tra cứu thêm rồi nộp lại.')}
}

/* ============ TRUY VẾT ============ */
function renderFinal(){
  const key='final';
  app.innerHTML=topbar()+`<div class="stack">
  <button class="linkbtn" id="back" style="align-self:flex-start">← Bản đồ chặng</button>
  <div><div class="kicker">Màn cuối</div><h2 style="font-size:24px;margin-top:4px">Truy vết</h2></div>
  <p class="brief">Đặt 5 mảnh ghép cạnh nhau. Những cái tên, tên miền và con số nào lặp lại?</p>
  <div class="stack">${STAGES.map((s,i)=>`<div class="frag"><b>MẢNH ${i+1} · ${s.name.toUpperCase()}</b>${s.frag}</div>`).join('')}</div>
  <div class="card stack">${FINAL.qs.map((q,qi)=>qHTML(q,qi,key)).join('')}
   <div class="q"><label class="lbl" for="note">Viết 2 câu đính chính như một bản tin ngắn (không chấm điểm, giảng viên sẽ xem)</label><textarea id="note">${esc(S.note||'')}</textarea></div>
   <button class="btn block" id="submit">Chốt kết luận</button>${hintsHTML(key,['Mảnh 1, 2 và 5 có chung một số điện thoại. Mảnh 2 cho biết số đó đăng ký dưới tên ai.','Trang tinsieunong.net sống bằng gì? Xem lại mảnh 2.'])}</div></div>`;
  setNav('tasks');
  $('#back').onclick=()=>{S.cur=null;S.view='hub';save();render()};
  bindInputs(FINAL.qs,key);
  $('#note').addEventListener('input',e=>{S.note=e.target.value;save()});
  $('#submit').onclick=()=>submit(FINAL.qs,key,150,()=>{S.stage.final=stageScore(key,150);S.end=Date.now();S.view='result';save();sendResult();render();window.scrollTo(0,0)});
  const hb=$('#hintBtn'); if(hb)hb.onclick=()=>{S.hints[key]=(S.hints[key]||0)+1;stash(FINAL.qs,key);save();render()};
}

let inflight=false;
const FORM='https://docs.google.com/forms/d/e/1FAIpQLScs6hWIg-LNJs6TFdgRT0b0M6ENA1-JaQnddGGpRBVlOuPs2A/formResponse';
function sendResult(){
  const secs=Math.round(((S.end||Date.now())-S.start)/1000);
  const detail=STAGES.map((s,i)=>`C${i+1}:${S.stage[i]??0}`).join(' | ')+` | Truy vết:${S.stage.final??0} | Gợi ý đã mở:${Object.values(S.hints).reduce((a,b)=>a+b,0)} | Nộp sai:${Object.values(S.fails).reduce((a,b)=>a+b,0)}`+(S.note?` | Đính chính: ${S.note}`:'');
  const f=new URLSearchParams();
  f.append('entry.983351973',S.team); f.append('entry.1601203130',String(total()));
  f.append('entry.932556584',String(secs)); f.append('entry.549997770',code()); f.append('entry.1228198398',detail);
  S.sent='sending'; inflight=true; save();
  return fetch(FORM,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:f.toString()})
    .then(()=>{S.sent='ok';save()}).catch(()=>{S.sent='fail';save()}).finally(()=>{inflight=false;if(S.view==='result')renderResult()});
}
function fmtTime(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return `${m}:${String(s).padStart(2,'0')}`}
function code(){const t=fmtTime((S.end||Date.now())-S.start);const base=`${S.team}|${total()}|${t}`;let h=7;for(const c of base)h=(h*31+c.charCodeAt(0))%46656;
  return `${total()}Đ · ${t} · ${h.toString(36).toUpperCase().padStart(3,'0')}`}
function renderResult(){
  app.innerHTML=topbar()+`<div class="stack">
  <div><div class="kicker">Hồ sơ đã đóng</div><h2 style="font-size:28px;margin-top:4px">Kẻ thả tin là <span class="mark">Ngô Thanh Tuấn</span></h2></div>
  <p>Một trang “Shop Phụ Kiện” đổi tên thành trang hóng biến, lấy clip trong nhóm chat kín, thêm giấy tờ giả, ảnh cũ, “luật sư” giả để kéo người đọc sang trang chạy quảng cáo cá cược.</p>
  <div class="card stack"><div class="kicker">Mã kết quả của đội ${esc(S.team)}</div><div class="result-code">${code()}</div>
   <p class="muted" style="font-size:13px" id="sendStatus">${S.sent==='ok'?'✓ Đã gửi kết quả lên bảng xếp hạng của giảng viên.':(S.sent==='fail'||!inflight)?'Chưa gửi được kết quả (có thể do mất mạng). Bấm gửi lại, hoặc đọc mã này cho giảng viên.':'Đang gửi kết quả lên bảng xếp hạng…'}</p>
   ${S.sent!=='ok'&&!inflight?'<button class="btn small" id="resend">Gửi lại kết quả</button>':''}</div>
  <div class="card stack"><div class="kicker">Chuyện thật đêm 14/10</div><ul class="truth">
   <li><span class="tm">22:50</span><span>An và Huy cãi nhau vì chuyện ồn ào ban đêm. An bỏ ra cầu thang.</span></li>
   <li><span class="tm">22:58</span><span>An trượt chân ở bậc vừa lau, đập trán, la lên. Huy cõng An xuống, gọi taxi.</span></li>
   <li><span class="tm">23:20</span><span>An nhập viện: rách trán khâu 4 mũi, bong gân cổ chân.</span></li>
   <li><span class="tm">23:31</span><span>Khánh Vy gửi clip vào nhóm tự quản, 9 phút sau nhắn đính chính.</span></li>
   <li><span class="tm">23:58</span><span>Hóng Biến Hòa Lâm đăng clip lên Threads với nội dung bịa đặt.</span></li>
   <li><span class="tm">08:30</span><span>An xuất viện, về nhà với mẹ.</span></li></ul></div>
  ${S.note?`<div class="card stack"><div class="kicker">Bản đính chính của đội</div><p>${esc(S.note)}</p></div>`:''}
  <div class="card stack"><div class="kicker">Điểm từng chặng</div>
   <table class="mono" style="width:100%;font-size:14px;border-collapse:collapse">${STAGES.map((s,i)=>`<tr><td style="padding:4px 0">${i+1}. ${s.name}</td><td style="text-align:right">${S.stage[i]??0}</td></tr>`).join('')}
   <tr><td style="padding:4px 0">★ Truy vết</td><td style="text-align:right">${S.stage.final??0}</td></tr>
   <tr><td style="padding:6px 0;border-top:1px solid var(--line)"><b>Tổng</b></td><td style="text-align:right;border-top:1px solid var(--line)"><b>${total()}</b></td></tr></table></div>
  <div class="foot"><button class="linkbtn" id="reset">Chơi lại từ đầu</button></div></div>`;
  setNav('tasks'); bindReset();
  const rs=$('#resend'); if(rs)rs.onclick=()=>{rs.disabled=true;sendResult()};
}

/* ============ TRA CỨU ============ */
let mode='web', lastQ='', revSel='';
function renderSearch(){
  const seen=Object.keys(IMAGES).filter(k=>S.seen.includes(k));
  app.innerHTML=topbar()+`<div class="stack">
  <div class="seg-ctl"><button data-mode="web" aria-pressed="${mode==='web'}">Tìm kiếm</button><button data-mode="img" aria-pressed="${mode==='img'}">Tra ảnh</button></div>
  ${mode==='web'?`<form class="sbar" id="sf"><input type="text" id="sq" placeholder="Tên tài khoản, tên miền, họ tên, số điện thoại…" value="${esc(lastQ)}" autocomplete="off"><button class="btn" type="submit">Tìm</button></form>
   <p class="tip">Mẹo: gõ đúng từ khóa bạn nhặt được trong tư liệu, ví dụ một @tên tài khoản, một tên miền, hoặc “whois” + tên miền.</p><div class="stack" id="results"></div>`
  :`<div class="card stack"><label class="lbl" for="imgsel">Chọn ảnh đã gặp trong tư liệu</label>
   ${seen.length?`<select id="imgsel"><option value="">— Chọn ảnh —</option>${seen.map(k=>`<option value="${k}" ${revSel===k?'selected':''}>${k} · ${IMAGES[k].cap}</option>`).join('')}</select><button class="btn" id="revgo">Tra ảnh ngược</button>`
   :`<p class="muted">Chưa có ảnh nào. Mở tư liệu có ảnh, ảnh sẽ tự xuất hiện ở đây.</p>`}</div><div id="revres"></div>`}
  </div>`;
  setNav('search');
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
  if(mode==='web'){ $('#sf').onsubmit=e=>{e.preventDefault();lastQ=$('#sq').value;doSearch()}; if(lastQ)doSearch(); }
  else{ const g=$('#revgo'); if(g)g.onclick=()=>{revSel=$('#imgsel').value;showRev()}; if(revSel)showRev(); }
}
function doSearch(){
  const q=norm(lastQ), box=$('#results');
  if(q.length<3){box.innerHTML='<p class="tip">Gõ ít nhất 3 ký tự.</p>';return}
  const hits=Object.entries(DOCS).filter(([id,d])=>d.kw.some(k=>{const kk=norm(k);return q.includes(kk)||(q.length>=4&&kk.includes(q))}));
  box.innerHTML=hits.length?hits.map(([id,d])=>{const tmp=document.createElement('div');tmp.innerHTML=d.body();const sn=tmp.textContent.replace(/\s+/g,' ').trim().slice(0,110);
    return `<button class="result" data-doc="${id}"><div class="rs">${d.src}</div><div class="rt">${d.t}</div><div class="rx">${esc(sn)}…</div></button>`}).join('')
   :`<div class="card"><p><b>Không có kết quả.</b></p><p class="tip">Thử một từ khóa khác lấy từ tư liệu: tên trang, @tài khoản, tên miền, họ tên, tên bệnh viện, tên công ty, số điện thoại.</p></div>`;
  bindDocs(box);
}
function showRev(){const b=$('#revres');if(!revSel){b.innerHTML='';return}const m=IMAGES[revSel];
  b.innerHTML=`<div class="rev"><div class="rh">${revSel} · ${m.cap}</div><div class="rh">Đang lưu hành tại: ${m.where}</div>${m.rev}</div>`}

/* ============ MANH MỐI ============ */
function renderClues(){
  const frags=STAGES.map((s,i)=>solved(i)?`<div class="frag"><b>MẢNH ${i+1}</b>${s.frag}</div>`:'').join('');
  app.innerHTML=topbar()+`<div class="stack"><div><div class="kicker">Bảng manh mối</div><h2 style="font-size:24px;margin-top:4px">Mảnh ghép và tư liệu đã lưu</h2></div>
  <div class="stack">${frags||'<p class="muted">Chưa có mảnh ghép. Hoàn thành chặng 1 để nhận mảnh đầu tiên.</p>'}</div>
  <div class="card stack"><div class="kicker">Tư liệu đã lưu</div>${S.saved.length?`<div class="mat">${matsHTML(S.saved)}</div>`:'<p class="muted" style="font-size:14px">Khi mở một tư liệu, bấm “Lưu vào manh mối” để giữ lại ở đây.</p>'}</div>
  <div class="foot"><button class="linkbtn" id="reset">Xóa tiến trình, chơi lại</button></div></div>`;
  setNav('clues'); bindDocs(app); bindReset();
}
function bindReset(){const r=$('#reset');if(!r)return;r.onclick=()=>{
  sheet(`<div class="sh"><h3>Chơi lại từ đầu?</h3><button class="close" data-close aria-label="Đóng">×</button></div><p>Toàn bộ điểm, mảnh ghép và tư liệu đã lưu của đội trên máy này sẽ bị xóa.</p>
  <div class="row"><button class="btn" id="yes">Xóa và chơi lại</button><button class="btn ghost" data-close>Giữ lại</button></div>`);
  $('#yes').onclick=()=>{S=fresh();save();closeSheet();render();window.scrollTo(0,0)}}}

/* ============ XEM TƯ LIỆU ============ */
function markSeen(id){const d=DOCS[id];if(!d)return;(d.body().match(/data-media="(IMG\d+)"/g)||[]).forEach(m=>{const k=m.match(/IMG\d+/)[0];if(!S.seen.includes(k))S.seen.push(k)});save()}
function bindDocs(root){root.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.doc))}
function openDoc(id){const d=DOCS[id];markSeen(id);const sv=S.saved.includes(id);
  sheet(`<div class="sh"><div style="min-width:0"><div class="src">${d.src}</div><h3 style="margin-top:4px">${d.t}</h3></div><button class="close" data-close aria-label="Đóng">×</button></div>
  <div class="doc">${d.body()}</div><button class="btn ${sv?'ghost':''}" id="savebtn">${sv?'Đã lưu · bấm để bỏ':'Lưu vào manh mối'}</button>`);
  $('#savebtn').onclick=()=>{if(S.saved.includes(id))S.saved=S.saved.filter(x=>x!==id);else S.saved.push(id);save();openDoc(id);setNav(S.view==='search'?'search':S.view==='clues'?'clues':'tasks')};
  document.querySelectorAll('#sheetRoot [data-rev]').forEach(b=>b.onclick=()=>{revSel=b.dataset.rev;mode='img';S.view='search';save();closeSheet();render();window.scrollTo(0,0)});
}
function sheet(html){$('#sheetRoot').innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#sbg').onclick=e=>{if(e.target.id==='sbg'||e.target.closest('[data-close]'))closeSheet()};
  document.querySelectorAll('#sheetRoot [data-rev]').forEach(b=>b.onclick=()=>{revSel=b.dataset.rev;mode='img';S.view='search';save();closeSheet();render()})}
function closeSheet(){$('#sheetRoot').innerHTML=''; if(S.view==='clues')renderClues()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

render();
</script>
